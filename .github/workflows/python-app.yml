name: Responsible AI Random Forest Classifier

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run_notebook:
    runs-on: windows-latest  # Use Windows runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install papermill  # Install papermill for running the notebook
        pip install ipykernel  # Install ipykernel to ensure proper kernel is available

    - name: Run Jupyter Notebook
      run: |
        python -m ipykernel install --user  # Install the kernel
        papermill responsible_ai_toolbox.ipynb output_notebook.ipynb  # Replace with your notebook filename

    - name: Commit output notebook
      uses: EndBug/add-and-commit@v9
      with:
        author_name: github-actions
        author_email: github-actions@github.com
        message: 'Run notebook and commit the output'
        add: 'output_notebook.ipynb'

